name: Institution Results Collector

on:
  workflow_dispatch:

jobs:
  collect-results:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Collect Institution Results
        run: |
          python institution-collector/collect_results.py

      - name: Show Result File
        run: |
          echo "=============================================="
          echo "INSTITUTION RESULT FILE"
          echo "=============================================="

          if [ -f institution-collector/institution_results.json ]; then
            cat institution-collector/institution_results.json
          else
            echo "institution_results.json NOT FOUND"
            exit 1
          fi

      - name: Save Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add institution-collector/institution_results.json

          git diff --cached --quiet || git commit -m "Update institution results"

          git push