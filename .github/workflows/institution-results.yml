name: Institution Results Collector

on:
  workflow_dispatch:

jobs:
  collect-results:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Check Files
        run: |
          echo "=============================================="
          echo "CHECKING FILES"
          echo "=============================================="

          python --version

          echo ""
          echo "Collector:"
          ls -lh institution-collector/collect_results.py

          echo ""
          echo "Institutions:"
          ls -lh institution-collector/institutions.json

          echo ""
          echo "=============================================="

      - name: Collect Institution Results
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python -u institution-collector/collect_results.py

      - name: Show Result Summary
        run: |
          echo "=============================================="
          echo "INSTITUTION RESULT SUMMARY"
          echo "=============================================="

          if [ -f institution-collector/institution_results.json ]; then

            echo "Result file found."

            python - <<'PY'
          import json

          file = "institution-collector/institution_results.json"

          with open(file, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Results collected:", len(data))
          print("Output:", file)

          if data:
              print("")
              print("First result:")
              print(json.dumps(data[0], ensure_ascii=False, indent=2))

              print("")
              print("Last result:")
              print(json.dumps(data[-1], ensure_ascii=False, indent=2))
          PY

          else

            echo "institution_results.json NOT FOUND"
            exit 1

          fi

      - name: Save Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add institution-collector/institution_results.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update institution results"

          git fetch origin main
          git rebase origin/main

          git push origin main