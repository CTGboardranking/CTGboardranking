name: Generate Supabase Config

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  generate-config:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Generate supabase-config.js
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |

          mkdir -p js

          cat > js/supabase-config.js <<EOF
          const SUPABASE_URL = "${SUPABASE_URL}";
          const SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}";
          EOF

          echo "Supabase frontend config generated."


      - name: Commit config
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add js/supabase-config.js

          if git diff --cached --quiet; then

            echo "No changes to commit."

          else

            git commit -m "Generate Supabase frontend config"
            git push

          fi