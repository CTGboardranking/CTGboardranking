name: Supabase Keep Alive

on:
  schedule:
    # প্রতিদিন বাংলাদেশ সময় সকাল ৬:৩০
    # 00:30 UTC = 06:30 Bangladesh Time
    - cron: "30 0 * * *"

  # GitHub Actions থেকে manually চালানোর জন্য
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest

    steps:
      - name: Send small Supabase request
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

        run: |
          set -e

          echo "======================================"
          echo "CTGboardranking Supabase Keep Alive"
          echo "======================================"

          HTTP_STATUS=$(curl \
            --silent \
            --show-error \
            --output /dev/null \
            --write-out "%{http_code}" \
            --get \
            "${SUPABASE_URL}/rest/v1/students" \
            --data-urlencode "select=roll" \
            --data-urlencode "limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}")

          echo "Supabase HTTP Status: ${HTTP_STATUS}"

          if [ "${HTTP_STATUS}" -ge 200 ] && [ "${HTTP_STATUS}" -lt 300 ]; then
            echo "✅ Supabase request successful."
            echo "✅ CTGboardranking project is responding normally."
          else
            echo "❌ Supabase request failed."
            echo "HTTP Status: ${HTTP_STATUS}"
            exit 1
          fi