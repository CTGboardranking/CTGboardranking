name: SSC Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssc-ranking-update
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run SSC data collection
        run: |
          python scraper/ssc_test.py

      - name: Generate institution statistics
        run: |
          python scraper/institution_stats.py

      - name: Convert institution CSV
        run: |
          python scraper/csv_to_institutions.py

      - name: Validate institution data
        run: |
          python scraper/ranking_validator.py

      - name: Calculate institution ranking
        run: |
          python scraper/ranking_engine.py

      - name: Calculate district ranking
        run: |
          python scraper/district_ranking.py

      - name: Calculate student ranking
        run: |
          python scraper/student_ranking.py

      - name: Calculate year-wise ranking
        run: |
          python scraper/year_ranking.py

      - name: Calculate board ranking
        run: |
          python scraper/board_ranking.py

      - name: Show collection summary
        if: always()
        run: |
          echo "========================================"
          echo "SSC COLLECTION SUMMARY"
          echo "========================================"

          if [ -f scraper/student_collection_summary.json ]; then
            cat scraper/student_collection_summary.json
          else
            echo "student_collection_summary.json not found"
          fi

          echo ""
          echo "========================================"
          echo "STUDENT COUNT"
          echo "========================================"

          if [ -f scraper/students.json ]; then
            python -c "import json; d=json.load(open('scraper/students.json', encoding='utf-8')); print('Total students:', len(d)); print('First roll:', d[0].get('roll') if d else 'N/A'); print('Last roll:', d[-1].get('roll') if d else 'N/A')"
          else
            echo "students.json not found"
          fi

      # =====================================================
      # PREPARE LARGE JSON FILES FOR GITHUB
      # =====================================================

      - name: Prepare large JSON files for GitHub
        run: |
          python <<'PY'
          import json
          import os
          import math

          BASE = "scraper"

          # Keep generated files safely below GitHub's
          # 100 MB single-file limit.
          MAX_BYTES = 45 * 1024 * 1024

          FILES = [
              (
                  "students.json",
                  "students_parts",
                  "students_manifest.json"
              ),
              (
                  "student_ranking.json",
                  "student_ranking_parts",
                  "student_ranking_manifest.json"
              )
          ]

          def write_json(path, data):

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      data,
                      f,
                      ensure_ascii=False,
                      separators=(",", ":")
                  )

          for filename, parts_dir, manifest_name in FILES:

              source = os.path.join(
                  BASE,
                  filename
              )

              output_dir = os.path.join(
                  BASE,
                  parts_dir
              )

              if not os.path.exists(source):

                  print(
                      f"Skipping {source}: "
                      f"file not found"
                  )

                  continue

              source_size = os.path.getsize(
                  source
              )

              print("")
              print("=" * 70)
              print(
                  f"Processing: {source}"
              )
              print(
                  f"Original size: "
                  f"{source_size / 1024 / 1024:.2f} MB"
              )
              print("=" * 70)

              # Already small enough.
              if source_size <= MAX_BYTES:

                  print(
                      f"{filename} is already below "
                      f"{MAX_BYTES / 1024 / 1024:.0f} MB."
                  )

                  continue

              print(
                  "Loading JSON..."
              )

              with open(
                  source,
                  "r",
                  encoding="utf-8"
              ) as f:

                  data = json.load(f)

              # JSON array
              if isinstance(data, list):

                  records = data
                  wrapper_key = None

              # JSON object containing an array
              elif isinstance(data, dict):

                  wrapper_key = None

                  for key, value in data.items():

                      if isinstance(value, list):

                          wrapper_key = key
                          break

                  if wrapper_key is None:

                      raise ValueError(
                          f"No JSON array found in "
                          f"{source}"
                      )

                  records = data[
                      wrapper_key
                  ]

              else:

                  raise ValueError(
                      f"Unsupported JSON structure "
                      f"in {source}"
                  )

              total = len(records)

              print(
                  f"Total records: "
                  f"{total:,}"
              )

              os.makedirs(
                  output_dir,
                  exist_ok=True
              )

              # Remove only previously generated
              # split files.
              for old in os.listdir(
                  output_dir
              ):

                  old_path = os.path.join(
                      output_dir,
                      old
                  )

                  if os.path.isfile(
                      old_path
                  ):

                      os.remove(
                          old_path
                      )

              # Estimate number of parts.
              estimated_parts = max(
                  2,
                  math.ceil(
                      source_size /
                      (40 * 1024 * 1024)
                  )
              )

              print(
                  f"Initial estimated parts: "
                  f"{estimated_parts}"
              )

              while True:

                  chunk_size = math.ceil(
                      total /
                      estimated_parts
                  )

                  print(
                      f"Trying "
                      f"{estimated_parts} parts "
                      f"("
                      f"{chunk_size:,}"
                      f" records/part)..."
                  )

                  created = []

                  for part_number, start in enumerate(
                      range(
                          0,
                          total,
                          chunk_size
                      ),
                      start=1
                  ):

                      end = min(
                          start + chunk_size,
                          total
                      )

                      part_records = records[
                          start:end
                      ]

                      if wrapper_key is None:

                          output_data = (
                              part_records
                          )

                      else:

                          output_data = {
                              wrapper_key:
                                  part_records
                          }

                      part_filename = (
                          f"part_"
                          f"{part_number:04d}"
                          f".json"
                      )

                      part_path = os.path.join(
                          output_dir,
                          part_filename
                      )

                      write_json(
                          part_path,
                          output_data
                      )

                      size = os.path.getsize(
                          part_path
                      )

                      size_mb = (
                          size /
                          1024 /
                          1024
                      )

                      created.append(
                          (
                              part_path,
                              len(part_records),
                              size
                          )
                      )

                      print(
                          f"  {part_filename}: "
                          f"{len(part_records):,} "
                          f"records "
                          f"({size_mb:.2f} MB)"
                      )

                  oversized = [
                      item
                      for item in created
                      if item[2] > MAX_BYTES
                  ]

                  if not oversized:

                      break

                  print(
                      "Some parts are still too large."
                  )

                  for path, _, _ in created:

                      if os.path.exists(
                          path
                      ):

                          os.remove(
                              path
                          )

                  estimated_parts *= 2

              # Create manifest.
              manifest = {
                  "source": filename,
                  "total_records": total,
                  "parts": []
              }

              for path, count, size in created:

                  relative_path = os.path.relpath(
                      path,
                      "."
                  )

                  manifest[
                      "parts"
                  ].append(
                      {
                          "file":
                              relative_path,

                          "records":
                              count,

                          "size_mb":
                              round(
                                  size /
                                  1024 /
                                  1024,
                                  2
                              )
                      }
                  )

              manifest_path = os.path.join(
                  BASE,
                  manifest_name
              )

              with open(
                  manifest_path,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      manifest,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

              print("")
              print(
                  f"✓ Finished {filename}"
              )

              print(
                  f"✓ Total records: "
                  f"{total:,}"
              )

              print(
                  f"✓ Parts created: "
                  f"{len(created)}"
              )

              # Original files are NOT deleted.
              print(
                  f"✓ Original {filename} "
                  f"kept for artifact backup."
              )

          # =================================================
          # FINAL SIZE CHECK
          # =================================================

          print("")
          print("=" * 70)
          print("FINAL JSON FILE CHECK")
          print("=" * 70)

          failed = False

          for root, dirs, files in os.walk(
              BASE
          ):

              for name in files:

                  if not name.endswith(
                      ".json"
                  ):

                      continue

                  path = os.path.join(
                      root,
                      name
                  )

                  size = os.path.getsize(
                      path
                  )

                  size_mb = (
                      size /
                      1024 /
                      1024
                  )

                  if size >= (
                      100 *
                      1024 *
                      1024
                  ):

                      # Original large files are allowed
                      # to remain for artifact backup.
                      if name in (
                          "students.json",
                          "student_ranking.json"
                      ):

                          print(
                              f"Artifact-only large file: "
                              f"{path} = "
                              f"{size_mb:.2f} MB"
                          )

                          continue

                      print(
                          f"ERROR: {path} = "
                          f"{size_mb:.2f} MB"
                      )

                      failed = True

                  else:

                      print(
                          f"OK: {path} = "
                          f"{size_mb:.2f} MB"
                      )

          if failed:

              raise RuntimeError(
                  "One or more GitHub-bound JSON "
                  "files exceed 100 MB."
              )

          print("")
          print(
              "✓ All GitHub-bound JSON files "
              "are below 100 MB."
          )

          PY

      # =====================================================
      # COMMIT UPDATED RANKING DATA
      # =====================================================

      - name: Commit updated ranking data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          echo "========================================"
          echo "PREPARING GIT CHANGES"
          echo "========================================"

          git add scraper/

          # Remove ONLY the two oversized original files
          # from the staged commit.
          git restore --staged scraper/students.json 2>/dev/null || true
          git restore --staged scraper/student_ranking.json 2>/dev/null || true

          # IMPORTANT:
          # Restore the original large files in the working tree.
          # This prevents the rebase from failing with
          # "You have unstaged changes".
          git restore scraper/students.json 2>/dev/null || true
          git restore scraper/student_ranking.json 2>/dev/null || true

          echo ""
          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short

          if git diff --cached --quiet; then

            echo ""
            echo "No changes detected."

            exit 0

          fi

          echo ""
          echo "========================================"
          echo "COMMITTING UPDATED RANKING DATA"
          echo "========================================"

          git commit -m "Update SSC ranking data"

          echo ""
          echo "Fetching latest main branch..."

          git fetch origin main

          echo ""
          echo "Rebasing on latest main..."

          git rebase origin/main

          echo ""
          echo "Pushing updated ranking data..."

          git push origin HEAD:main

          echo ""
          echo "========================================"
          echo "✓ SSC RANKING DATA PUSHED SUCCESSFULLY"
          echo "========================================"

      # =====================================================
      # UPLOAD COMPLETE SSC DATA BACKUP
      # =====================================================

      - name: Upload SSC data backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssc-data
          path: scraper/
          if-no-files-found: warn