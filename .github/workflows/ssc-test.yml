name: SSC Test

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ssc-ranking-update
  cancel-in-progress: false

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: main

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # =====================================================
      # CHECK STUDENTS JSON
      # =====================================================

      - name: Check students JSON
        run: |

          echo "=============================================="
          echo "CHECKING STUDENTS JSON"
          echo "=============================================="

          if [ ! -f scraper/students.json ]; then

            echo "ERROR: scraper/students.json not found."

            exit 1

          fi

          python - <<'PY'

          import json
          import os

          path = "scraper/students.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)


          print("")
          print("==============================================")
          print("STUDENTS JSON CHECK")
          print("==============================================")


          print(
              "students.json total:",
              len(data)
          )


          rolls = set()


          for student in data:

              if not isinstance(
                  student,
                  dict
              ):
                  continue

              roll = str(
                  student.get(
                      "roll",
                      ""
                  )
              ).strip()

              if roll:
                  rolls.add(roll)


          print(
              "unique rolls:",
              len(rolls)
          )


          if rolls:

              print(
                  "first roll:",
                  min(
                      rolls,
                      key=int
                  )
              )

              print(
                  "last roll:",
                  max(
                      rolls,
                      key=int
                  )
              )


          print("")
          print("FILE SIZE")

          size = os.path.getsize(path)

          print(
              f"{size / 1024 / 1024:.2f} MB"
          )


          print("")
          print("==============================================")
          print("GROUP COUNTS")
          print("==============================================")


          groups = {}


          for student in data:

              if not isinstance(
                  student,
                  dict
              ):
                  continue

              group = student.get(
                  "group",
                  "Unknown"
              )

              groups[group] = (
                  groups.get(
                      group,
                      0
                  ) + 1
              )


          for group, count in groups.items():

              print(
                  f"{group}: {count}"
              )


          print("")
          print("==============================================")
          print("CHECK COMPLETE")
          print("==============================================")

          PY