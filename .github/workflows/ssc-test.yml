name: SSC Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ssc-ranking-update
  cancel-in-progress: false

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # =====================================================
      # SHOW EXISTING DATA
      # =====================================================

      - name: Show existing data
        run: |
          echo "=============================================="
          echo "EXISTING SSC DATA"
          echo "=============================================="

          if [ -f scraper/students.json ]; then

            python - <<'PY'
          import json

          path = "scraper/students.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          print("Existing students:", len(data))

          if data:
              print("First roll:", data[0].get("roll"))
              print("Last roll:", data[-1].get("roll"))

          groups = {}

          for student in data:

              group = student.get(
                  "group",
                  "Unknown"
              )

              groups[group] = groups.get(
                  group,
                  0
              ) + 1

          print("")
          print("GROUP COUNTS")

          for group, count in groups.items():

              print(
                  f"{group}: {count}"
              )
          PY

          else

            echo "students.json not found"

          fi

      # =====================================================
      # SSC COLLECTION
      # =====================================================

      - name: Run SSC data collection
        run: |
          python scraper/ssc_test.py

      # =====================================================
      # SHOW COLLECTION RESULT
      # =====================================================

      - name: Show collection result
        if: always()
        run: |
          echo "=============================================="
          echo "SSC COLLECTION RESULT"
          echo "=============================================="

          if [ -f scraper/student_collection_summary.json ]; then
            cat scraper/student_collection_summary.json
          fi

          echo ""

          if [ -f scraper/students.json ]; then

            python - <<'PY'
          import json

          with open(
              "scraper/students.json",
              "r",
              encoding="utf-8"
          ) as f:

              students = json.load(f)

          print(
              "Total students:",
              len(students)
          )

          if students:

              print(
                  "First roll:",
                  students[0].get("roll")
              )

              print(
                  "Last roll:",
                  students[-1].get("roll")
              )
          PY

          fi

      # =====================================================
      # INSTITUTION STATISTICS
      # =====================================================

      - name: Generate institution statistics
        run: |
          python scraper/institution_stats.py

      # =====================================================
      # INSTITUTION CSV
      # =====================================================

      - name: Convert institution CSV
        run: |
          python scraper/csv_to_institutions.py

      # =====================================================
      # VALIDATION
      # =====================================================

      - name: Validate institution data
        run: |
          python scraper/ranking_validator.py

      # =====================================================
      # INSTITUTION RANKING
      # =====================================================

      - name: Calculate institution ranking
        run: |
          python scraper/ranking_engine.py

      # =====================================================
      # DISTRICT RANKING
      # =====================================================

      - name: Calculate district ranking
        run: |
          python scraper/district_ranking.py

      # =====================================================
      # STUDENT RANKING
      # =====================================================

      - name: Calculate student ranking
        run: |
          python scraper/student_ranking.py

      # =====================================================
      # YEAR RANKING
      # =====================================================

      - name: Calculate year-wise ranking
        run: |
          python scraper/year_ranking.py

      # =====================================================
      # BOARD RANKING
      # =====================================================

      - name: Calculate board ranking
        run: |
          python scraper/board_ranking.py

      # =====================================================
      # VALIDATE ALL JSON
      # =====================================================

      - name: Validate JSON files
        run: |
          python - <<'PY'
          import json
          import os

          failed = False

          for root, dirs, files in os.walk("scraper"):

              for name in files:

                  if not name.endswith(".json"):
                      continue

                  path = os.path.join(
                      root,
                      name
                  )

                  try:

                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:

                          json.load(f)

                      size = os.path.getsize(path)

                      print(
                          f"OK: {path} "
                          f"({size / 1024 / 1024:.2f} MB)"
                      )

                  except Exception as e:

                      print(
                          f"ERROR: {path} -> {e}"
                      )

                      failed = True

          if failed:

              raise SystemExit(
                  "JSON validation failed."
              )

          print("")
          print("All JSON files are valid.")
          PY

      # =====================================================
      # GIT STATUS
      # =====================================================

      - name: Show generated files
        if: always()
        run: |
          echo "=============================================="
          echo "GENERATED FILES"
          echo "=============================================="

          find scraper \
            -type f \
            -printf "%p %k KB\n" \
            | sort

      # =====================================================
      # COMMIT SAFE FILES
      # =====================================================

      - name: Commit ranking data
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          echo "=============================================="
          echo "PREPARING COMMIT"
          echo "=============================================="

          git add scraper/

          # -------------------------------------------------
          # DO NOT PUSH VERY LARGE SOURCE DATA TO GITHUB
          # -------------------------------------------------

          if [ -f scraper/students.json ]; then

            SIZE=$(stat -c%s scraper/students.json)

            LIMIT=$((90 * 1024 * 1024))

            if [ "$SIZE" -gt "$LIMIT" ]; then

              echo "students.json is larger than 90 MB."

              git restore \
                --staged \
                scraper/students.json \
                2>/dev/null || true

              git restore \
                scraper/students.json \
                2>/dev/null || true

            fi

          fi

          if [ -f scraper/student_ranking.json ]; then

            SIZE=$(stat -c%s scraper/student_ranking.json)

            LIMIT=$((90 * 1024 * 1024))

            if [ "$SIZE" -gt "$LIMIT" ]; then

              echo "student_ranking.json is larger than 90 MB."

              git restore \
                --staged \
                scraper/student_ranking.json \
                2>/dev/null || true

              git restore \
                scraper/student_ranking.json \
                2>/dev/null || true

            fi

          fi

          echo ""
          echo "STAGED CHANGES"

          git status --short

          if git diff --cached --quiet; then

            echo ""
            echo "No Git changes detected."

            exit 0

          fi

          git commit \
            -m "Update SSC ranking data"

      # =====================================================
      # SYNC
      # =====================================================

      - name: Sync latest main
        run: |

          git fetch origin main

          git rebase origin/main

      # =====================================================
      # PUSH
      # =====================================================

      - name: Push changes
        run: |

          echo "=============================================="
          echo "PUSHING DATA"
          echo "=============================================="

          git push origin HEAD:main

          echo ""
          echo "=============================================="
          echo "SSC DATA PUSHED SUCCESSFULLY"
          echo "=============================================="

      # =====================================================
      # FINAL COUNT
      # =====================================================

      - name: Final student count
        if: always()
        run: |

          echo "=============================================="
          echo "FINAL STUDENT COUNT"
          echo "=============================================="

          if [ -f scraper/students.json ]; then

            python - <<'PY'
          import json

          with open(
              "scraper/students.json",
              "r",
              encoding="utf-8"
          ) as f:

              students = json.load(f)

          print(
              "Final total:",
              len(students)
          )

          if students:

              print(
                  "First roll:",
                  students[0].get("roll")
              )

              print(
                  "Last roll:",
                  students[-1].get("roll")
              )

          groups = {}

          for student in students:

              group = student.get(
                  "group",
                  "Unknown"
              )

              groups[group] = groups.get(
                  group,
                  0
              ) + 1

          print("")
          print("GROUP COUNTS")

          for group, count in groups.items():

              print(
                  f"{group}: {count}"
              )
          PY

          else

            echo "students.json not found"

          fi

      # =====================================================
      # BACKUP
      # =====================================================

      - name: Upload SSC data backup
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ssc-data
          path: scraper/
          if-no-files-found: warn