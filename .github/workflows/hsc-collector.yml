
name: HSC 2026 Data Collector

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Maximum records for this run"
        required: true
        default: "10"
        type: choice
        options:
          - "10"
          - "25"
          - "50"

permissions:
  contents: read

concurrency:
  group: hsc-2026-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run HSC Collector
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HSC_BATCH_SIZE: ${{ inputs.batch_size }}
        run: |
          python hsc_github_collector.py --limit "$HSC_BATCH_SIZE"
