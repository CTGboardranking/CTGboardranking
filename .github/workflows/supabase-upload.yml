name: Supabase Upload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-student-upload
  cancel-in-progress: false

jobs:
  upload:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check files
        run: |

          echo "=============================================="
          echo "CHECKING SUPABASE UPLOAD FILES"
          echo "=============================================="

          echo ""
          echo "SCRAPER FILES:"
          find scraper -maxdepth 1 -type f -printf "%p\n" | sort

          echo ""

          if [ ! -f scraper/students.json ]; then
            echo "ERROR: scraper/students.json not found."
            exit 1
          fi

          if [ ! -f scraper/upload_to_supabase.py ]; then
            echo "ERROR: scraper/upload_to_supabase.py not found."
            echo ""
            echo "The Python file must be located at:"
            echo "scraper/upload_to_supabase.py"
            exit 1
          fi

          echo "students.json: FOUND"
          echo "upload_to_supabase.py: FOUND"

          if [ -f scraper/supabase_upload_checkpoint.json ]; then

            echo ""
            echo "Existing checkpoint:"
            cat scraper/supabase_upload_checkpoint.json

          else

            echo ""
            echo "No checkpoint found."
            echo "Upload will start from index 0."

          fi

      - name: Upload students to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |

          echo "=============================================="
          echo "STARTING SUPABASE UPLOAD"
          echo "=============================================="

          python scraper/upload_to_supabase.py

      - name: Show checkpoint
        if: always()
        run: |

          echo "=============================================="
          echo "SUPABASE CHECKPOINT"
          echo "=============================================="

          if [ -f scraper/supabase_upload_checkpoint.json ]; then
            cat scraper/supabase_upload_checkpoint.json
          else
            echo "No checkpoint file found."
          fi

      - name: Commit checkpoint
        if: always()
        run: |

          echo "=============================================="
          echo "COMMITTING CHECKPOINT"
          echo "=============================================="

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ ! -f scraper/supabase_upload_checkpoint.json ]; then
            echo "No checkpoint to commit."
            exit 0
          fi

          git add scraper/supabase_upload_checkpoint.json

          if git diff --cached --quiet; then
            echo "No checkpoint changes."
            exit 0
          fi

          git commit -m "Update Supabase upload checkpoint"

          git pull --rebase origin main

          git push origin HEAD:main

          echo ""
          echo "CHECKPOINT PUSHED SUCCESSFULLY"

      - name: Final status
        if: always()
        run: |

          echo "=============================================="
          echo "FINAL SUPABASE UPLOAD STATUS"
          echo "=============================================="

          if [ -f scraper/supabase_upload_checkpoint.json ]; then

            python - <<'PY'
          import json

          path = "scraper/supabase_upload_checkpoint.json"

          with open(path, "r", encoding="utf-8") as f:
              data = json.load(f)

          uploaded = int(data.get("uploaded", 0))
          last_index = int(data.get("last_index", 0))
          total = int(data.get("total", 0))

          print("Uploaded:", uploaded)
          print("Last index:", last_index)
          print("Total:", total)
          print("Remaining:", max(total - last_index, 0))

          if last_index >= total:
              print("ALL RECORDS UPLOADED.")
          else:
              print("UPLOAD INCOMPLETE.")
              print("Run workflow again to resume.")

          PY

          else

            echo "No checkpoint available."

          fi

          echo "=============================================="