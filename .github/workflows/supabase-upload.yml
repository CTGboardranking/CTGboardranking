name: Supabase Upload

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: supabase-upload
  cancel-in-progress: false

jobs:

  upload:

    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # CHECKOUT
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =====================================================
      # PYTHON
      # =====================================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # =====================================================
      # DEPENDENCIES
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # =====================================================
      # CHECK EXISTING FILES
      # =====================================================

      - name: Check upload files
        run: |

          echo "=============================================="
          echo "SUPABASE UPLOAD"
          echo "=============================================="

          if [ ! -f scraper/students.json ]; then
            echo "ERROR: scraper/students.json not found."
            exit 1
          fi

          echo "students.json found."

          if [ -f scraper/supabase_upload_checkpoint.json ]; then
            echo "Checkpoint found."
            cat scraper/supabase_upload_checkpoint.json
          else
            echo "No checkpoint found."
            echo "Upload will start from index 0."
          fi

      # =====================================================
      # SUPABASE UPLOAD
      # =====================================================

      - name: Upload students to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |

          echo "=============================================="
          echo "STARTING SUPABASE UPLOAD"
          echo "=============================================="

          python scraper/upload_to_supabase.py

      # =====================================================
      # SHOW CHECKPOINT
      # =====================================================

      - name: Show upload checkpoint
        if: always()
        run: |

          echo "=============================================="
          echo "UPLOAD CHECKPOINT"
          echo "=============================================="

          if [ -f scraper/supabase_upload_checkpoint.json ]; then

            cat scraper/supabase_upload_checkpoint.json

          else

            echo "Checkpoint file not found."

          fi

      # =====================================================
      # GIT CONFIGURATION
      # =====================================================

      - name: Configure Git
        if: always()
        run: |

          git config user.name "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      # =====================================================
      # COMMIT CHECKPOINT
      # =====================================================

      - name: Commit checkpoint
        if: always()
        run: |

          echo "=============================================="
          echo "COMMITTING CHECKPOINT"
          echo "=============================================="

          git add scraper/supabase_upload_checkpoint.json

          if git diff --cached --quiet; then

            echo "No checkpoint changes."

          else

            git commit \
              -m "Update Supabase upload checkpoint"

          fi

      # =====================================================
      # SYNC MAIN
      # =====================================================

      - name: Sync latest main
        if: always()
        run: |

          git fetch origin main

          git rebase origin/main || {

            echo "Rebase conflict detected."

            git rebase --abort || true

            echo "Retrying with latest main."

            git pull \
              --rebase \
              origin main
          }

      # =====================================================
      # PUSH CHECKPOINT
      # =====================================================

      - name: Push checkpoint
        if: always()
        run: |

          echo "=============================================="
          echo "PUSHING CHECKPOINT"
          echo "=============================================="

          git push origin HEAD:main

          echo ""
          echo "Checkpoint pushed successfully."

      # =====================================================
      # FINAL STATUS
      # =====================================================

      - name: Final upload status
        if: always()
        run: |

          echo "=============================================="
          echo "FINAL SUPABASE UPLOAD STATUS"
          echo "=============================================="

          if [ -f scraper/supabase_upload_checkpoint.json ]; then

            python - <<'PY'

          import json

          path = "scraper/supabase_upload_checkpoint.json"

          with open(
              path,
              "r",
              encoding="utf-8"
          ) as f:

              data = json.load(f)

          print(
              "Uploaded:",
              data.get("uploaded", 0)
          )

          print(
              "Last index:",
              data.get("last_index", 0)
          )

          print(
              "Total:",
              data.get("total", 0)
          )

          total = data.get("total", 0)
          index = data.get("last_index", 0)

          print(
              "Remaining:",
              max(total - index, 0)
          )

          if index >= total:

              print("")
              print(
                  "ALL RECORDS UPLOADED."
              )

          else:

              print("")
              print(
                  "UPLOAD INCOMPLETE."
              )

              print(
                  "Run the workflow again to resume."
              )

          PY

          else

            echo "No checkpoint available."

          fi

          echo "=============================================="