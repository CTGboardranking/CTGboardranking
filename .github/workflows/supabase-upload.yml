import os
import json
import time
import requests


# ============================================================
# CONFIG
# ============================================================

SUPABASE_URL = os.getenv("SUPABASE_URL", "").strip()
SUPABASE_KEY = os.getenv("SUPABASE_KEY", "").strip()

TABLE_NAME = "students"

DATA_FILE = "scraper/students.json"

CHECKPOINT_FILE = (
    "scraper/supabase_upload_checkpoint.json"
)

BATCH_SIZE = 10000

REQUEST_TIMEOUT = 120

RETRY_COUNT = 5

RETRY_DELAY = 5


# ============================================================
# CHECK CONFIGURATION
# ============================================================

if not SUPABASE_URL:

    raise SystemExit(
        "ERROR: SUPABASE_URL is not set."
    )


if not SUPABASE_KEY:

    raise SystemExit(
        "ERROR: SUPABASE_KEY is not set."
    )


SUPABASE_URL = SUPABASE_URL.rstrip("/")


REST_URL = (
    f"{SUPABASE_URL}/rest/v1/{TABLE_NAME}"
)


HEADERS = {

    "apikey":
        SUPABASE_KEY,

    "Authorization":
        f"Bearer {SUPABASE_KEY}",

    "Content-Type":
        "application/json",

    "Prefer":
        "resolution=merge-duplicates,"
        "return=minimal",

}


# ============================================================
# PRINT HEADER
# ============================================================

print(
    "==================================================",
    flush=True
)

print(
    "SSC SUPABASE UPLOADER",
    flush=True
)

print(
    "==================================================",
    flush=True
)

print(
    "Table:",
    TABLE_NAME,
    flush=True
)

print(
    "Batch size:",
    BATCH_SIZE,
    flush=True
)

print(
    "Data file:",
    DATA_FILE,
    flush=True
)

print(
    "Checkpoint:",
    CHECKPOINT_FILE,
    flush=True
)

print(
    "==================================================",
    flush=True
)


# ============================================================
# LOAD JSON
# ============================================================

if not os.path.exists(DATA_FILE):

    raise SystemExit(
        f"ERROR: {DATA_FILE} not found."
    )


print(
    "Loading students.json...",
    flush=True
)


try:

    with open(
        DATA_FILE,
        "r",
        encoding="utf-8"
    ) as f:

        students = json.load(f)

except Exception as e:

    raise SystemExit(
        f"ERROR: Could not load students.json: {e}"
    )


if not isinstance(
    students,
    list
):

    raise SystemExit(
        "ERROR: students.json must contain a JSON list."
    )


TOTAL = len(students)


print(
    "Total local records:",
    TOTAL,
    flush=True
)


# ============================================================
# CHECKPOINT HELPERS
# ============================================================

def save_checkpoint(
    index,
    uploaded,
    skipped,
    failed,
):

    checkpoint = {

        "version":
            1,

        "total":
            TOTAL,

        "last_index":
            index,

        "uploaded":
            uploaded,

        "skipped":
            skipped,

        "failed":
            failed,

        "batch_size":
            BATCH_SIZE,

        "table":
            TABLE_NAME,

    }


    temp_file = (
        CHECKPOINT_FILE +
        ".tmp"
    )


    with open(
        temp_file,
        "w",
        encoding="utf-8"
    ) as f:

        json.dump(
            checkpoint,
            f,
            ensure_ascii=False,
            indent=2
        )


    os.replace(
        temp_file,
        CHECKPOINT_FILE
    )


def load_checkpoint():

    if not os.path.exists(
        CHECKPOINT_FILE
    ):

        return {

            "last_index":
                0,

            "uploaded":
                0,

            "skipped":
                0,

            "failed":
                0,

        }


    try:

        with open(
            CHECKPOINT_FILE,
            "r",
            encoding="utf-8"
        ) as f:

            data = json.load(f)


        if not isinstance(
            data,
            dict
        ):

            raise ValueError(
                "Invalid checkpoint format."
            )


        return data


    except Exception as e:

        print(
            "WARNING: Could not load checkpoint:",
            e,
            flush=True
        )

        print(
            "Starting from index 0.",
            flush=True
        )


        return {

            "last_index":
                0,

            "uploaded":
                0,

            "skipped":
                0,

            "failed":
                0,

        }


# ============================================================
# LOAD CHECKPOINT
# ============================================================

checkpoint = load_checkpoint()


START_INDEX = int(
    checkpoint.get(
        "last_index",
        0
    )
)


UPLOADED = int(
    checkpoint.get(
        "uploaded",
        0
    )
)


SKIPPED = int(
    checkpoint.get(
        "skipped",
        0
    )
)


FAILED = int(
    checkpoint.get(
        "failed",
        0
    )
)


# ============================================================
# CHECKPOINT SAFETY
# ============================================================

if START_INDEX < 0:

    START_INDEX = 0


if START_INDEX > TOTAL:

    START_INDEX = TOTAL


print(
    "",
    flush=True
)

print(
    "CHECKPOINT",
    flush=True
)

print(
    "Starting index:",
    START_INDEX,
    flush=True
)

print(
    "Previously uploaded:",
    UPLOADED,
    flush=True
)

print(
    "Previously skipped:",
    SKIPPED,
    flush=True
)

print(
    "Previously failed:",
    FAILED,
    flush=True
)

print(
    "Remaining local records:",
    TOTAL - START_INDEX,
    flush=True
)

print(
    "==================================================",
    flush=True
)


# ============================================================
# NOTHING TO DO
# ============================================================

if START_INDEX >= TOTAL:

    print(
        "All local records have already been processed.",
        flush=True
    )

    save_checkpoint(
        TOTAL,
        UPLOADED,
        SKIPPED,
        FAILED
    )

    raise SystemExit(0)


# ============================================================
# HTTP SESSION
# ============================================================

session = requests.Session()

session.headers.update(
    HEADERS
)


# ============================================================
# CLEAN RECORD
# ============================================================

def prepare_record(
    student
):

    if not isinstance(
        student,
        dict
    ):

        return None


    record = dict(
        student
    )


    # --------------------------------------------------------
    # Roll is required
    # --------------------------------------------------------

    roll = record.get(
        "roll"
    )


    if roll is None:

        return None


    roll = str(
        roll
    ).strip()


    if not roll:

        return None


    record["roll"] = roll


    # --------------------------------------------------------
    # Make sure common fields exist
    # --------------------------------------------------------

    defaults = {

        "name":
            "",

        "board":
            "",

        "group":
            "",

        "session":
            "",

        "type":
            "",

        "institute":
            "",

        "district":
            "",

        "result":
            "",

        "gpa":
            None,

        "total_score":
            None,

        "subjects":
            [],

    }


    for key, default in defaults.items():

        if key not in record:

            record[key] = default


    # --------------------------------------------------------
    # Normalize result
    # --------------------------------------------------------

    result = record.get(
        "result"
    )


    if result is None:

        result = ""


    record["result"] = str(
        result
    ).strip().upper()


    # --------------------------------------------------------
    # PASS / FAIL
    # --------------------------------------------------------

    if record["result"] in (
        "PASS",
        "FAIL"
    ):

        record["result"] = (
            record["result"]
        )


    # --------------------------------------------------------
    # GPA
    # --------------------------------------------------------

    if record.get(
        "gpa"
    ) == "":

        record["gpa"] = None


    # --------------------------------------------------------
    # Subjects
    # --------------------------------------------------------

    if not isinstance(
        record.get("subjects"),
        list
    ):

        record["subjects"] = []


    return record


# ============================================================
# UPLOAD ONE BATCH
# ============================================================

def upload_batch(
    batch,
    batch_number
):

    if not batch:

        return True


    print(
        "",
        flush=True
    )

    print(
        "--------------------------------------------------",
        flush=True
    )

    print(
        f"Uploading batch #{batch_number}",
        flush=True
    )

    print(
        "Records:",
        len(batch),
        flush=True
    )

    first_roll = batch[0].get(
        "roll",
        ""
    )

    last_roll = batch[-1].get(
        "roll",
        ""
    )

    print(
        "First roll:",
        first_roll,
        flush=True
    )

    print(
        "Last roll:",
        last_roll,
        flush=True
    )


    # --------------------------------------------------------
    # Retry
    # --------------------------------------------------------

    for attempt in range(
        1,
        RETRY_COUNT + 1
    ):

        try:

            response = session.post(

                REST_URL,

                headers=HEADERS,

                json=batch,

                timeout=REQUEST_TIMEOUT,

            )


            print(
                "HTTP:",
                response.status_code,
                f"(attempt {attempt})",
                flush=True
            )


            if response.status_code in (
                200,
                201,
                204
            ):

                print(
                    "Batch uploaded successfully.",
                    flush=True
                )

                return True


            # ------------------------------------------------
            # Duplicate / conflict
            # ------------------------------------------------

            if response.status_code == 409:

                print(
                    "Conflict detected.",
                    flush=True
                )

                print(
                    "Trying upsert again...",
                    flush=True
                )


                retry_headers = dict(
                    HEADERS
                )

                retry_headers["Prefer"] = (
                    "resolution=merge-duplicates,"
                    "return=minimal"
                )


                retry_response = session.post(

                    REST_URL,

                    headers=retry_headers,

                    json=batch,

                    timeout=REQUEST_TIMEOUT,

                )


                print(
                    "Retry HTTP:",
                    retry_response.status_code,
                    flush=True
                )


                if retry_response.status_code in (
                    200,
                    201,
                    204
                ):

                    print(
                        "Batch uploaded using upsert.",
                        flush=True
                    )

                    return True


                print(
                    retry_response.text[:1000],
                    flush=True
                )


            else:

                print(
                    "Supabase error:",
                    response.text[:1000],
                    flush=True
                )


        except requests.exceptions.RequestException as e:

            print(
                "Request error:",
                e,
                flush=True
            )


        if attempt < RETRY_COUNT:

            print(
                f"Waiting {RETRY_DELAY}s before retry...",
                flush=True
            )

            time.sleep(
                RETRY_DELAY
            )


    return False


# ============================================================
# COLLECTION
# ============================================================

current_index = START_INDEX

batch_number = (
    current_index // BATCH_SIZE
) + 1


run_uploaded = 0

run_skipped = 0

run_failed = 0


# ============================================================
# PROCESS
# ============================================================

while current_index < TOTAL:

    end_index = min(

        current_index +
        BATCH_SIZE,

        TOTAL

    )


    raw_batch = students[
        current_index:end_index
    ]


    valid_batch = []


    # --------------------------------------------------------
    # Prepare records
    # --------------------------------------------------------

    for student in raw_batch:

        record = prepare_record(
            student
        )


        if record is None:

            run_skipped += 1

            SKIPPED += 1

            continue


        valid_batch.append(
            record
        )


    print(
        "",
        flush=True
    )

    print(
        "==================================================",
        flush=True
    )

    print(
        f"PROCESSING "
        f"{current_index + 1}-"
        f"{end_index} / {TOTAL}",
        flush=True
    )

    print(
        "Valid records:",
        len(valid_batch),
        flush=True
    )

    print(
        "==================================================",
        flush=True
    )


    # --------------------------------------------------------
    # Empty batch
    # --------------------------------------------------------

    if not valid_batch:

        current_index = end_index

        save_checkpoint(

            current_index,

            UPLOADED,

            SKIPPED,

            FAILED

        )

        continue


    # --------------------------------------------------------
    # Upload
    # --------------------------------------------------------

    success = upload_batch(

        valid_batch,

        batch_number

    )


    # --------------------------------------------------------
    # Successful
    # --------------------------------------------------------

    if success:

        count = len(
            valid_batch
        )


        UPLOADED += count

        run_uploaded += count


        current_index = end_index


        save_checkpoint(

            current_index,

            UPLOADED,

            SKIPPED,

            FAILED

        )


        print(
            "",
            flush=True
        )

        print(
            "CHECKPOINT SAVED",
            flush=True
        )

        print(
            "Current index:",
            current_index,
            flush=True
        )

        print(
            "Uploaded total:",
            UPLOADED,
            flush=True
        )

        print(
            "Remaining:",
            TOTAL - current_index,
            flush=True
        )


        batch_number += 1

        continue


    # --------------------------------------------------------
    # Failed batch
    # --------------------------------------------------------

    print(
        "",
        flush=True
    )

    print(
        "ERROR: Batch upload failed.",
        flush=True
    )

    print(
        "Checkpoint will NOT move forward.",
        flush=True
    )

    print(
        "Run the workflow again to retry this batch.",
        flush=True
    )


    FAILED += len(
        valid_batch
    )

    run_failed += len(
        valid_batch
    )


    save_checkpoint(

        current_index,

        UPLOADED,

        SKIPPED,

        FAILED

    )


    raise SystemExit(
        "Supabase upload stopped safely."
    )


# ============================================================
# FINAL CHECKPOINT
# ============================================================

save_checkpoint(

    TOTAL,

    UPLOADED,

    SKIPPED,

    FAILED

)


# ============================================================
# FINAL RESULT
# ============================================================

print(
    "",
    flush=True
)

print(
    "==================================================",
    flush=True
)

print(
    "SUPABASE UPLOAD COMPLETE",
    flush=True
)

print(
    "==================================================",
    flush=True
)

print(
    "Local records:",
    TOTAL,
    flush=True
)

print(
    "Uploaded this run:",
    run_uploaded,
    flush=True
)

print(
    "Uploaded total:",
    UPLOADED,
    flush=True
)

print(
    "Skipped total:",
    SKIPPED,
    flush=True
)

print(
    "Failed total:",
    FAILED,
    flush=True
)

print(
    "Remaining:",
    max(
        TOTAL - START_INDEX - run_uploaded,
        0
    ),
    flush=True
)

print(
    "Checkpoint:",
    CHECKPOINT_FILE,
    flush=True
)

print(
    "==================================================",
    flush=True
)

print(
    "DONE",
    flush=True
)