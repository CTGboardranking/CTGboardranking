name: HSC 2026 Source Inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Inspect All Group Pages
        run: |
          python - <<'PY'
          import os
          import requests
          from bs4 import BeautifulSoup

          BASE = "https://boardexamrankings.vercel.app/hsc/2026"

          GROUPS = {
              "SCIENCE": "science",
              "COMMERCE": "business_studies",
              "HUMANITIES": "humanities",
          }

          os.makedirs("probe", exist_ok=True)

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0"
          })

          for group_name, slug in GROUPS.items():

              print("\n" + "=" * 55)
              print("GROUP:", group_name)
              print("=" * 55)

              for page in range(1, 4):

                  url = f"{BASE}/{slug}/?page={page}"

                  print(f"\n--- PAGE {page} ---")
                  print("URL:", url)

                  try:
                      response = session.get(url, timeout=30)

                      print("HTTP:", response.status_code)

                      response.raise_for_status()

                      soup = BeautifulSoup(
                          response.text,
                          "html.parser"
                      )

                      table = None

                      for candidate in soup.find_all("table"):
                          headers = [
                              th.get_text(" ", strip=True)
                              for th in candidate.find_all("th")
                          ]

                          if "Roll" in headers and "Student Name" in headers:
                              table = candidate
                              break

                      if table is None:
                          print("STUDENT TABLE: NOT FOUND")
                          continue

                      headers = [
                          th.get_text(" ", strip=True)
                          for th in table.find_all("th")
                      ]

                      print("HEADERS:", headers)

                      rows = table.find_all("tr")
                      students = []

                      for row in rows[1:]:
                          cells = row.find_all(["td", "th"])

                          if len(cells) < 6:
                              continue

                          values = [
                              cell.get_text(" ", strip=True)
                              for cell in cells
                          ]

                          if values[1].isdigit():
                              students.append(values)

                      print("STUDENTS:", len(students))

                      if students:
                          print("FIRST STUDENT:", students[0])
                          print("LAST STUDENT:", students[-1])

                      filename = (
                          f"probe/{slug}_page_{page}.html"
                      )

                      with open(
                          filename,
                          "w",
                          encoding="utf-8"
                      ) as file:
                          file.write(response.text)

                  except Exception as error:
                      print("ERROR:", str(error))

          print("\n" + "=" * 55)
          print("PAGINATION INSPECTION COMPLETED")
          print("=" * 55)
          PY

      - name: Upload Inspection Files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hsc-pagination-inspection
          path: probe/
          if-no-files-found: warn
          retention-days: 7
