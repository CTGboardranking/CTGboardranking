<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Discover Institutions | CTGBoardRanking</title>

<meta name="theme-color" content="#f5f5f7">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<!-- PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>

<style>

:root{
    --bg:#f5f5f7;
    --card:rgba(255,255,255,.78);
    --card-solid:#ffffff;
    --text:#111113;
    --muted:#6e6e73;
    --border:rgba(0,0,0,.08);
    --blue:#0071e3;
    --blue2:#2997ff;
    --green:#34c759;
    --orange:#ff9500;
    --shadow:
        0 20px 50px rgba(0,0,0,.07),
        0 2px 8px rgba(0,0,0,.04);
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display",
    "SF Pro Text",Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 5%,rgba(41,151,255,.10),transparent 28%),
        radial-gradient(circle at 90% 15%,rgba(175,82,222,.08),transparent 25%),
        var(--bg);
    color:var(--text);
    min-height:100vh;
}

/* ================= HEADER ================= */

.header{
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(25px) saturate(180%);
    -webkit-backdrop-filter:blur(25px) saturate(180%);
    background:rgba(245,245,247,.78);
    border-bottom:1px solid rgba(0,0,0,.06);
}

.header-inner{
    max-width:1200px;
    margin:auto;
    min-height:72px;
    padding:0 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.brand{
    display:flex;
    align-items:center;
    gap:12px;
    text-decoration:none;
    color:var(--text);
}

.brand-icon{
    width:40px;
    height:40px;
    border-radius:13px;
    display:grid;
    place-items:center;
    color:white;
    font-weight:800;
    font-size:19px;
    background:
        linear-gradient(145deg,#111,#4b4b4b);
    box-shadow:
        inset 0 1px rgba(255,255,255,.3),
        0 8px 20px rgba(0,0,0,.14);
}

.brand-name{
    font-size:18px;
    font-weight:750;
    letter-spacing:-.5px;
}

.back-btn{
    border:1px solid var(--border);
    background:rgba(255,255,255,.7);
    color:var(--text);
    text-decoration:none;
    padding:10px 16px;
    border-radius:999px;
    font-size:14px;
    font-weight:600;
    transition:.2s;
}

.back-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 8px 20px rgba(0,0,0,.08);
}

/* ================= HERO ================= */

.hero{
    max-width:1000px;
    margin:auto;
    padding:70px 22px 35px;
    text-align:center;
}

.hero-label{
    display:inline-flex;
    align-items:center;
    gap:7px;
    padding:7px 12px;
    border-radius:999px;
    background:rgba(0,113,227,.09);
    color:var(--blue);
    font-size:12px;
    font-weight:750;
    letter-spacing:.6px;
    text-transform:uppercase;
}

.hero h1{
    margin-top:18px;
    font-size:clamp(38px,7vw,68px);
    line-height:.98;
    letter-spacing:-3.5px;
    font-weight:800;
}

.hero p{
    max-width:650px;
    margin:20px auto 0;
    color:var(--muted);
    font-size:17px;
    line-height:1.6;
}

/* ================= SEARCH ================= */

.search-wrap{
    max-width:760px;
    margin:10px auto 0;
    padding:0 22px 35px;
}

.search-box{
    height:58px;
    display:flex;
    align-items:center;
    gap:12px;
    padding:0 18px;
    background:rgba(255,255,255,.84);
    border:1px solid rgba(0,0,0,.08);
    border-radius:19px;
    box-shadow:var(--shadow);
    transition:.2s;
}

.search-box:focus-within{
    border-color:rgba(0,113,227,.35);
    box-shadow:
        0 0 0 4px rgba(0,113,227,.08),
        var(--shadow);
}

.search-icon{
    font-size:21px;
    color:#777;
}

.search-box input{
    width:100%;
    border:0;
    outline:0;
    background:transparent;
    font-family:inherit;
    font-size:15px;
    color:var(--text);
}

/* ================= CONTENT ================= */

.container{
    max-width:1200px;
    margin:auto;
    padding:0 22px 80px;
}

.section-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:20px;
    margin:20px 0 20px;
}

.section-head h2{
    font-size:27px;
    letter-spacing:-1.1px;
}

.result-count{
    color:var(--muted);
    font-size:13px;
}

/* ================= GRID ================= */

.institution-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.institution-card{
    position:relative;
    overflow:hidden;
    cursor:pointer;
    min-height:235px;
    padding:23px;
    border:1px solid rgba(0,0,0,.07);
    border-radius:25px;
    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.92),
            rgba(247,247,249,.78)
        );
    box-shadow:var(--shadow);
    transition:
        transform .28s ease,
        box-shadow .28s ease,
        border-color .28s ease;
}

.institution-card::before{
    content:"";
    position:absolute;
    width:180px;
    height:180px;
    border-radius:50%;
    background:rgba(0,113,227,.09);
    filter:blur(5px);
    right:-90px;
    top:-90px;
}

.institution-card:hover{
    transform:translateY(-6px);
    border-color:rgba(0,113,227,.18);
    box-shadow:
        0 28px 60px rgba(0,0,0,.11),
        0 0 0 1px rgba(0,113,227,.03);
}

.card-top{
    position:relative;
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:12px;
}

.institute-icon{
    width:48px;
    height:48px;
    border-radius:16px;
    display:grid;
    place-items:center;
    background:
        linear-gradient(145deg,#e8f3ff,#dbeaff);
    color:var(--blue);
    font-size:22px;
}

.card-arrow{
    width:34px;
    height:34px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:rgba(0,0,0,.045);
    color:#555;
    transition:.2s;
}

.institution-card:hover .card-arrow{
    background:var(--blue);
    color:#fff;
    transform:translateX(3px);
}

.card-name{
    margin-top:20px;
    font-size:18px;
    line-height:1.3;
    letter-spacing:-.45px;
    font-weight:720;
}

.card-location{
    margin-top:7px;
    color:var(--muted);
    font-size:13px;
}

.card-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:7px;
    margin-top:22px;
}

.mini-stat{
    min-width:0;
    padding:10px 8px;
    border-radius:13px;
    background:rgba(0,0,0,.035);
}

.mini-stat strong{
    display:block;
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.mini-stat span{
    display:block;
    margin-top:3px;
    color:var(--muted);
    font-size:10px;
}

/* ================= EMPTY / LOADING ================= */

.state{
    grid-column:1/-1;
    padding:70px 20px;
    text-align:center;
    color:var(--muted);
}

.loader{
    width:32px;
    height:32px;
    border:3px solid rgba(0,0,0,.1);
    border-top-color:var(--blue);
    border-radius:50%;
    animation:spin .7s linear infinite;
    margin:0 auto 15px;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

/* ================= MODAL ================= */

.modal{
    position:fixed;
    inset:0;
    z-index:500;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.38);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
}

.modal.show{
    display:flex;
}

.modal-panel{
    width:min(760px,100%);
    max-height:92vh;
    overflow:auto;
    background:rgba(255,255,255,.96);
    border:1px solid rgba(255,255,255,.8);
    border-radius:30px;
    box-shadow:
        0 35px 100px rgba(0,0,0,.25);
    animation:modalIn .28s ease;
}

@keyframes modalIn{
    from{
        opacity:0;
        transform:translateY(20px) scale(.97);
    }
    to{
        opacity:1;
        transform:none;
    }
}

.modal-head{
    position:sticky;
    top:0;
    z-index:3;
    padding:24px 25px 20px;
    background:rgba(255,255,255,.88);
    backdrop-filter:blur(20px);
    border-bottom:1px solid rgba(0,0,0,.06);
}

.modal-head-row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:15px;
}

.modal-title{
    font-size:26px;
    line-height:1.2;
    letter-spacing:-1.1px;
}

.modal-subtitle{
    margin-top:7px;
    color:var(--muted);
    font-size:13px;
    line-height:1.5;
}

.close-btn{
    flex:none;
    width:38px;
    height:38px;
    border:0;
    border-radius:50%;
    background:#f0f0f2;
    cursor:pointer;
    font-size:20px;
}

.modal-body{
    padding:25px;
}

.detail-hero{
    padding:22px;
    border-radius:22px;
    background:
        linear-gradient(135deg,#eef7ff,#f7f2ff);
    border:1px solid rgba(0,113,227,.08);
}

.detail-grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin-top:20px;
}

.detail-item{
    padding:17px;
    border:1px solid rgba(0,0,0,.065);
    border-radius:17px;
    background:#fff;
}

.detail-item span{
    display:block;
    color:var(--muted);
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.5px;
}

.detail-item strong{
    display:block;
    margin-top:7px;
    font-size:19px;
    line-height:1.25;
    overflow-wrap:anywhere;
}

.detail-item.full{
    grid-column:1/-1;
}

.pdf-btn{
    width:100%;
    margin-top:20px;
    min-height:54px;
    border:0;
    border-radius:17px;
    background:
        linear-gradient(135deg,#0071e3,#2997ff);
    color:#fff;
    font-family:inherit;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:
        0 12px 28px rgba(0,113,227,.23);
    transition:.2s;
}

.pdf-btn:hover{
    transform:translateY(-2px);
    box-shadow:
        0 17px 35px rgba(0,113,227,.28);
}

.pdf-btn:disabled{
    opacity:.6;
    cursor:wait;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;
    padding:35px 20px 50px;
    color:#8a8a8f;
    font-size:12px;
}

/* ================= RESPONSIVE ================= */

@media(max-width:900px){

    .institution-grid{
        grid-template-columns:repeat(2,1fr);
    }

}

@media(max-width:620px){

    .header-inner{
        min-height:64px;
    }

    .brand-name{
        font-size:16px;
    }

    .brand-icon{
        width:36px;
        height:36px;
    }

    .back-btn{
        padding:8px 13px;
        font-size:12px;
    }

    .hero{
        padding-top:48px;
    }

    .hero h1{
        letter-spacing:-2.2px;
    }

    .hero p{
        font-size:15px;
    }

    .institution-grid{
        grid-template-columns:1fr;
    }

    .detail-grid{
        grid-template-columns:1fr;
    }

    .detail-item.full{
        grid-column:auto;
    }

    .modal{
        padding:10px;
        align-items:flex-end;
    }

    .modal-panel{
        max-height:94vh;
        border-radius:28px 28px 20px 20px;
    }

    .modal-title{
        font-size:22px;
    }

}

</style>
</head>

<body>

<header class="header">
    <div class="header-inner">

        <a href="index.html" class="brand">
            <div class="brand-icon">C</div>
            <div class="brand-name">CTGBoardRanking</div>
        </a>

        <a href="index.html" class="back-btn">
            ← Home
        </a>

    </div>
</header>


<section class="hero">

    <div class="hero-label">
        ✦ Institution Explorer
    </div>

    <h1>
        Discover Institutions.
    </h1>

    <p>
        Explore SSC 2026 institutional performance,
        compare results and view detailed academic statistics.
    </p>

</section>


<div class="search-wrap">

    <div class="search-box">

        <span class="search-icon">⌕</span>

        <input
            id="searchInput"
            type="search"
            placeholder="Search institution, EIIN, district or thana..."
            autocomplete="off"
        >

    </div>

</div>


<main class="container">

    <div class="section-head">

        <h2>Institutions</h2>

        <div class="result-count" id="resultCount">
            Loading...
        </div>

    </div>

    <div
        class="institution-grid"
        id="institutionGrid"
    >

        <div class="state">
            <div class="loader"></div>
            Loading institutions...
        </div>

    </div>

</main>


<footer class="footer">
    © 2026 CTGBoardRanking · Generated by Shadat Fatih
</footer>


<!-- ================= INSTITUTION MODAL ================= -->

<div
    class="modal"
    id="institutionModal"
>

    <div class="modal-panel">

        <div class="modal-head">

            <div class="modal-head-row">

                <div>

                    <h2
                        class="modal-title"
                        id="modalTitle"
                    >
                        Institution
                    </h2>

                    <div
                        class="modal-subtitle"
                        id="modalSubtitle"
                    ></div>

                </div>

                <button
                    class="close-btn"
                    onclick="closeModal()"
                    aria-label="Close"
                >
                    ×
                </button>

            </div>

        </div>


        <div class="modal-body">

            <div class="detail-hero">

                <div
                    style="
                    color:#0071e3;
                    font-size:11px;
                    font-weight:800;
                    letter-spacing:.8px;
                    text-transform:uppercase;
                    "
                >
                    SSC 2026
                </div>

                <div
                    id="detailInstitutionName"
                    style="
                    margin-top:8px;
                    font-size:23px;
                    font-weight:800;
                    line-height:1.25;
                    letter-spacing:-.7px;
                    overflow-wrap:anywhere;
                    "
                ></div>

            </div>


            <div
                class="detail-grid"
                id="detailGrid"
            ></div>


            <button
                class="pdf-btn"
                id="pdfButton"
                onclick="generatePDF()"
            >
                ↓ &nbsp; Download Institution PDF
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const JSON_URL =
    "institution-collector/institution_results.json";


/* =========================================================
   STATE
========================================================= */

let institutions = [];
let filteredInstitutions = [];
let selectedInstitution = null;


/* =========================================================
   DOM
========================================================= */

const grid =
    document.getElementById("institutionGrid");

const searchInput =
    document.getElementById("searchInput");

const resultCount =
    document.getElementById("resultCount");

const modal =
    document.getElementById("institutionModal");

const modalTitle =
    document.getElementById("modalTitle");

const modalSubtitle =
    document.getElementById("modalSubtitle");

const detailInstitutionName =
    document.getElementById("detailInstitutionName");

const detailGrid =
    document.getElementById("detailGrid");

const pdfButton =
    document.getElementById("pdfButton");


/* =========================================================
   LOAD JSON
========================================================= */

async function loadInstitutions(){

    try{

        const response =
            await fetch(
                JSON_URL + "?v=" + Date.now(),
                {
                    cache:"no-store"
                }
            );

        if(!response.ok){

            throw new Error(
                `HTTP ${response.status}`
            );

        }

        const data =
            await response.json();

        if(!Array.isArray(data)){

            throw new Error(
                "Invalid JSON format. Expected an array."
            );

        }

        institutions =
            data.filter(item =>
                item &&
                item.institution_name
            );

        filteredInstitutions =
            [...institutions];

        renderInstitutions();

    }
    catch(error){

        console.error(error);

        grid.innerHTML = `
            <div class="state">

                <div style="
                    font-size:38px;
                    margin-bottom:12px;
                ">
                    ⚠️
                </div>

                <strong style="
                    display:block;
                    color:#111;
                    margin-bottom:7px;
                ">
                    Institution data could not be loaded.
                </strong>

                <span>
                    ${escapeHTML(error.message)}
                </span>

            </div>
        `;

        resultCount.textContent =
            "Data unavailable";

    }

}


/* =========================================================
   RENDER CARDS
========================================================= */

function renderInstitutions(){

    resultCount.textContent =
        `${filteredInstitutions.length.toLocaleString()} institutions`;

    if(!filteredInstitutions.length){

        grid.innerHTML = `
            <div class="state">

                <div style="
                    font-size:35px;
                    margin-bottom:10px;
                ">
                    🔎
                </div>

                No institutions found.

            </div>
        `;

        return;
    }


    /*
       To prevent a huge DOM for very large JSON files,
       render the first 300 results.
    */

    const visible =
        filteredInstitutions.slice(0,300);


    grid.innerHTML =
        visible.map(
            (item,index) =>
                createInstitutionCard(item,index)
        ).join("");

}


function createInstitutionCard(item,index){

    const name =
        safeValue(
            item.institution_name,
            "Unknown Institution"
        );

    const district =
        safeValue(
            item.district,
            "Unknown District"
        );

    const thana =
        safeValue(
            item.thana,
            "—"
        );

    const appeared =
        numberValue(item.appeared);

    const passed =
        numberValue(item.passed);

    const gpa5 =
        numberValue(item.gpa5);


    return `

        <article
            class="institution-card"
            onclick="openInstitution(${index})"
        >

            <div class="card-top">

                <div class="institute-icon">
                    🏫
                </div>

                <div class="card-arrow">
                    →
                </div>

            </div>


            <div class="card-name">
                ${escapeHTML(name)}
            </div>


            <div class="card-location">

                ${escapeHTML(district)}
                ·
                ${escapeHTML(thana)}

            </div>


            <div class="card-stats">

                <div class="mini-stat">
                    <strong>
                        ${formatNumber(appeared)}
                    </strong>
                    <span>Appeared</span>
                </div>

                <div class="mini-stat">
                    <strong>
                        ${formatNumber(passed)}
                    </strong>
                    <span>Passed</span>
                </div>

                <div class="mini-stat">
                    <strong>
                        ${formatNumber(gpa5)}
                    </strong>
                    <span>GPA 5</span>
                </div>

            </div>

        </article>

    `;

}


/* =========================================================
   SEARCH
========================================================= */

searchInput.addEventListener(
    "input",
    function(){

        const query =
            this.value
                .trim()
                .toLowerCase();


        if(!query){

            filteredInstitutions =
                [...institutions];

        }
        else{

            filteredInstitutions =
                institutions.filter(item => {

                    const text = [

                        item.institution_name,
                        item.eiin,
                        item.district,
                        item.thana,
                        item.board,
                        item.year

                    ]
                    .join(" ")
                    .toLowerCase();

                    return text.includes(query);

                });

        }

        renderInstitutions();

    }
);


/* =========================================================
   OPEN INSTITUTION
========================================================= */

function openInstitution(index){

    /*
       Important:
       filteredInstitutions is the array currently displayed.
    */

    const item =
        filteredInstitutions[index];

    if(!item) return;

    selectedInstitution =
        item;


    modalTitle.textContent =
        safeValue(
            item.institution_name,
            "Institution"
        );


    modalSubtitle.textContent =
        `${safeValue(item.district,"—")} · ${safeValue(item.thana,"—")} · SSC ${safeValue(item.year,"2026")}`;


    detailInstitutionName.textContent =
        safeValue(
            item.institution_name,
            "Institution"
        );


    renderDetails(item);


    modal.classList.add("show");

    document.body.style.overflow =
        "hidden";

}


function renderDetails(item){

    /*
       GPA5 and total_gpa are intentionally
       displayed separately but both use the
       same GPA5 value as requested.
    */

    const gpa5 =
        numberValue(item.gpa5);


    const totalGpa =
        gpa5;


    const details = [

        ["EIIN", item.eiin],

        ["District", item.district],

        ["Thana / Upazila", item.thana],

        ["Board", item.board],

        ["Year", item.year],

        ["Appeared", item.appeared],

        ["Passed", item.passed],

        ["Passing Rate", formatPercent(item.passing_rate)],

        ["GPA 5", gpa5],

        ["Total GPA", totalGpa]

    ];


    detailGrid.innerHTML =
        details.map(
            ([label,value]) => `

                <div class="detail-item">

                    <span>
                        ${escapeHTML(label)}
                    </span>

                    <strong>
                        ${escapeHTML(
                            formatDetailValue(value)
                        )}
                    </strong>

                </div>

            `
        ).join("");

}


function closeModal(){

    modal.classList.remove("show");

    document.body.style.overflow =
        "";

    selectedInstitution =
        null;

}


modal.addEventListener(
    "click",
    function(event){

        if(event.target === modal){

            closeModal();

        }

    }
);


document.addEventListener(

/* =========================================================
   PDF GENERATION
========================================================= */

async function generatePDF(){

    if(!selectedInstitution){

        return;

    }


    if(
        !window.jspdf ||
        !window.jspdf.jsPDF
    ){

        alert(
            "PDF library could not be loaded. Please check your internet connection."
        );

        return;

    }


    const originalText =
        pdfButton.innerHTML;


    pdfButton.disabled =
        true;

    pdfButton.innerHTML =
        "Generating premium PDF…";


    try{

        const { jsPDF } =
            window.jspdf;


        const doc =
            new jsPDF({
                orientation:"portrait",
                unit:"mm",
                format:"a4",
                compress:true
            });


        /*
           Apple-inspired monochrome + blue design.
        */

        const pageWidth =
            doc.internal.pageSize.getWidth();

        const pageHeight =
            doc.internal.pageSize.getHeight();

        const margin =
            18;


        /* =========================
           HEADER
        ========================= */

        doc.setFillColor(
            248,249,251
        );

        doc.rect(
            0,
            0,
            pageWidth,
            42,
            "F"
        );


        doc.setTextColor(
            15,15,17
        );

        doc.setFont(
            "helvetica",
            "bold"
        );

        doc.setFontSize(22);

        doc.text(
            "CTGboardranking",
            pageWidth / 2,
            17,
            {
                align:"center"
            }
        );


        doc.setFont(
            "helvetica",
            "normal"
        );

        doc.setFontSize(9);

        doc.setTextColor(
            90,90,95
        );

        doc.text(
            "Generated by Shadat Fatih",
            pageWidth / 2,
            24,
            {
                align:"center"
            }
        );


        const generatedAt =
            new Date().toLocaleString(
                "en-BD",
                {
                    dateStyle:"long",
                    timeStyle:"short"
                }
            );


        doc.text(
            generatedAt,
            pageWidth / 2,
            30,
            {
                align:"center"
            }
        );


        /* =========================
           INSTITUTION TITLE
        ========================= */

        let y = 54;


        doc.setTextColor(
            15,15,17
        );

        doc.setFont(
            "helvetica",
            "bold"
        );

        doc.setFontSize(18);


        const institutionName =
            safeValue(
                selectedInstitution.institution_name,
                "Institution"
            );


        const titleLines =
            doc.splitTextToSize(
                institutionName,
                pageWidth - margin * 2
            );


        doc.text(
            titleLines,
            margin,
            y
        );


        y +=
            titleLines.length * 7 +
            5;


        doc.setFont(
            "helvetica",
            "normal"
        );

        doc.setFontSize(9);

        doc.setTextColor(
            90,90,95
        );


        const location =
            `${safeValue(selectedInstitution.district,"—")} · ${safeValue(selectedInstitution.thana,"—")} · ${safeValue(selectedInstitution.board,"—")}`;


        doc.text(
            location,
            margin,
            y
        );


        y += 9;


        /* =========================
           DATA TABLE
        ========================= */


        const gpa5 =
            numberValue(
                selectedInstitution.gpa5
            );


        /*
           GPA5 and Total GPA intentionally
           use exactly the same source value.
        */

        const rows = [

            [
                "EIIN",
                safeValue(
                    selectedInstitution.eiin,
                    "—"
                )
            ],

            [
                "Institution",
                institutionName
            ],

            [
                "District",
                safeValue(
                    selectedInstitution.district,
                    "—"
                )
            ],

            [
                "Thana / Upazila",
                safeValue(
                    selectedInstitution.thana,
                    "—"
                )
            ],

            [
                "Board",
                safeValue(
                    selectedInstitution.board,
                    "—"
                )
            ],

            [
                "Year",
                safeValue(
                    selectedInstitution.year,
                    "2026"
                )
            ],

            [
                "Appeared",
                formatNumber(
                    numberValue(
                        selectedInstitution.appeared
                    )
                )
            ],

            [
                "Passed",
                formatNumber(
                    numberValue(
                        selectedInstitution.passed
                    )
                )
            ],

            [
                "Passing Rate",
                formatPercent(
                    selectedInstitution.passing_rate
                )
            ],

            [
                "GPA 5",
                formatNumber(gpa5)
            ],

            [
                "Total GPA",
                formatNumber(gpa5)
            ]

        ];


        doc.autoTable({

            startY:y,

            margin:{
                left:margin,
                right:margin
            },

            head:[
                [
                    "Performance Metric",
                    "Value"
                ]
            ],

            body:rows,

            theme:"grid",

            styles:{
                font:"helvetica",
                fontSize:9,
                cellPadding:4,
                lineColor:[225,226,230],
                lineWidth:.2,
                textColor:[25,25,28],
                overflow:"linebreak",
                valign:"middle"
            },

            headStyles:{
                fillColor:[20,20,22],
                textColor:[255,255,255],
                fontStyle:"bold",
                halign:"left"
            },

            columnStyles:{
                0:{
                    cellWidth:55,
                    fontStyle:"bold"
                },

                1:{
                    cellWidth:"auto"
                }
            },

            alternateRowStyles:{
                fillColor:[248,249,251]
            },

            pageBreak:"auto",

            rowPageBreak:"avoid",

            didParseCell:function(data){

                /*
                   Prevent text from overflowing.
                */

                if(data.cell){

                    data.cell.styles.overflow =
                        "linebreak";

                }

            },

            didDrawPage:function(data){

                drawPDFHeaderFooter(
                    doc,
                    pageWidth,
                    pageHeight
                );

            }

        });


        /* =========================
           FOOTER
        ========================= */

        const totalPages =
            doc.getNumberOfPages();


        for(
            let page = 1;
            page <= totalPages;
            page++
        ){

            doc.setPage(page);

            drawPDFHeaderFooter(
                doc,
                pageWidth,
                pageHeight,
                page,
                totalPages
            );

        }


        /* =========================
           FILE NAME
        ========================= */

        const safeName =
            institutionName
                .replace(
                    /[^a-z0-9\u0980-\u09FF]+/gi,
                    "_"
                )
                .replace(
                    /^_+|_+$/g,
                    ""
                )
                .slice(0,80);


        doc.save(
            `CTGBoardRanking_${safeName || "Institution"}_2026.pdf`
        );

    }
    catch(error){

        console.error(
            "PDF generation error:",
            error
        );

        alert(
            "PDF তৈরি করা যায়নি। আবার চেষ্টা করুন।"
        );

    }
    finally{

        pdfButton.disabled =
            false;

        pdfButton.innerHTML =
            originalText;

    }

}


/* =========================================================
   PDF HEADER / FOOTER
========================================================= */

function drawPDFHeaderFooter(
    doc,
    pageWidth,
    pageHeight,
    page,
    totalPages
){

    /*
       Footer background line.
    */

    doc.setDrawColor(
        225,226,230
    );

    doc.setLineWidth(.25);

    doc.line(
        18,
        pageHeight - 20,
        pageWidth - 18,
        pageHeight - 20
    );


    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setFontSize(7.5);

    doc.setTextColor(
        115,115,120
    );


    doc.text(
        "Unofficial Notice",
        pageWidth / 2,
        pageHeight - 11,
        {
            align:"center"
        }
    );


    if(
        page &&
        totalPages
    ){

        doc.text(
            `Page ${page} of ${totalPages}`,
            pageWidth - 18,
            pageHeight - 11,
            {
                align:"right"
            }
        );

    }

}


/* =========================================================
   HELPERS
========================================================= */

function safeValue(
    value,
    fallback="—"
){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return fallback;

    }

    return String(value);

}


function numberValue(value){

    const n =
        Number(value);

    return Number.isFinite(n)
        ? n
        : 0;

}


function formatNumber(value){

    const n =
        numberValue(value);

    return n.toLocaleString(
        "en-US"
    );

}


function formatPercent(value){

    const n =
        Number(value);

    if(!Number.isFinite(n)){

        return "0.00%";

    }

    return `${n.toFixed(2)}%`;

}


function formatDetailValue(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "—";

    }

    if(
        typeof value === "number"
    ){

        return value.toLocaleString(
            "en-US"
        );

    }

    return String(value);

}


function escapeHTML(value){

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
